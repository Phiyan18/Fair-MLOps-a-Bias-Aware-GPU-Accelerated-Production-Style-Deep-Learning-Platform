# Requires metrics-server (minikube: `minikube addons enable metrics-server`)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fairml-api
  namespace: fairml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fairml-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

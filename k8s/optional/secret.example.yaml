# Create the API-key secret WITHOUT committing real values:
#   kubectl -n fairml create secret generic fairml-secrets --from-literal=API_KEY="$(openssl rand -hex 24)"
# (this file only documents the shape)
apiVersion: v1
kind: Secret
metadata:
  name: fairml-secrets
  namespace: fairml
type: Opaque
stringData:
  API_KEY: "replace-me"

# API + Prometheus + Grafana.   docker compose up --build      (copy .env.example to .env first)
# UI http://localhost:8000 | Prometheus http://localhost:9090 | Grafana http://localhost:3000 (admin / $GRAFANA_PASSWORD)
services:
  api:
    build: .
    image: fairml-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      USE_QUANTIZED: "0"          # "1" serves the INT8 model
      ORT_THREADS: "1"
      API_KEY: "${FAIRML_API_KEY:-}"
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-0}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-change-me-please}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
